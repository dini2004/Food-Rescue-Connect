<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Rescue Connect - Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- Navigation Bar -->

    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                🍱 Food Rescue Connect
            </a>

        </div>

    </nav>



    <!-- Login Section -->

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-5">

                <div class="card shadow">

                    <!-- Card Header -->

                    <div class="card-header bg-success text-white text-center">

                        <h3 class="mb-0">
                            🔐 User Login
                        </h3>

                    </div>


                    <!-- Card Body -->

                    <div class="card-body p-4">

                        <form method="POST">


                            <!-- Login As -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Login As
                                </label>

                                <select
                                    name="role"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        -- Select Role --
                                    </option>

                                    <option value="Admin">
                                        👨‍💼 Admin
                                    </option>

                                    <option value="NGO">
                                        🏢 NGO
                                    </option>

                                    <option value="Donor">
                                        🍱 Donor
                                    </option>

                                    <option value="Delivery Partner">
                                        🚚 Delivery Partner
                                    </option>

                                </select>

                            </div>



                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>



                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>



                            <!-- Login Button -->

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                🔐 Login

                            </button>


                        </form>



                        <!-- Register -->

                        <div class="text-center mt-4">

                            <span>
                                Don't have an account?
                            </span>

                            <a href="/register"
                               class="text-success fw-bold">

                                Register

                            </a>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- Footer -->

    <footer class="text-center mt-5 text-muted">

        <hr>

        <p>
            © 2026 Food Rescue Connect | Developed by Dinesh K P
        </p>

    </footer>


</body>

</html>
