<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGO Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🍱 Food Rescue Connect
        </a>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        👋 Welcome, {{ full_name }}
    </h2>

    <div class="row">

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>📦 Available Donations</h3>

                    <p>View all available food donations.</p>

                    <a href="/available_donations" class="btn btn-success">
                        View Available
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>✅ Accepted Donations</h3>

                    <p>View accepted food donations.</p>

                    <a href="/accepted_donations" class="btn btn-primary">
                        View Accepted
                    </a>
                    <a href="/completed_donations"
                     class="btn btn-primary">

                          ✔ Completed Donations

                            </a>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center mt-5">

    <hr>

    <p>© 2026 Food Rescue Connect</p>

</footer>

</body>

</html>
