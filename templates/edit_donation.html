<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Donation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🍱 Food Rescue Connect
        </a>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">✏ Edit Donation</h2>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Food Name</label>

                    <input
                        type="text"
                        name="food_name"
                        class="form-control"
                        value="{{ donation[1] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Quantity</label>

                    <input
                        type="text"
                        name="quantity"
                        class="form-control"
                        value="{{ donation[2] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Expiry Time</label>

                    <input
                        type="datetime-local"
                        name="expiry_time"
                        class="form-control"
                        value="{{ donation[3] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Pickup Address</label>

                    <input
                        type="text"
                        name="pickup_address"
                        class="form-control"
                        value="{{ donation[4] }}"
                        required>

                </div>

                <button class="btn btn-success">

                    💾 Update Donation

                </button>

                <a href="/my_donations" class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
